<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inkwell – Blog Platform</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--ink:#1d1b19;--mute:#6b665f;--line:#e8e3dc;--acc:#2f5d50;--accT:#fff;--danger:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161513;--card:#201f1c;--ink:#f0ece6;--mute:#a09a90;--line:#33312c;--acc:#7fc4ad;--accT:#10201b;--danger:#ff8a80}}
:root[data-theme="dark"]{--bg:#161513;--card:#201f1c;--ink:#f0ece6;--mute:#a09a90;--line:#33312c;--acc:#7fc4ad;--accT:#10201b;--danger:#ff8a80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Georgia,'Times New Roman',serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line);max-width:760px;margin:0 auto}
.logo{font-weight:700;font-size:22px;cursor:pointer;color:var(--acc)}
nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-family:system-ui,sans-serif;font-size:14px}
main{max-width:760px;margin:0 auto;padding:20px}
button,input,textarea{font:inherit;font-family:system-ui,sans-serif}
button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:14px}
button.p{background:var(--acc);color:var(--accT);border-color:var(--acc)}
button.d{color:var(--danger)}
button.l{border:0;background:none;padding:0 4px;color:var(--mute);text-decoration:underline}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);margin:4px 0 12px;font-size:15px}
textarea{min-height:200px;resize:vertical}
label{font:600 13px system-ui,sans-serif;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px}
.post{cursor:pointer}.post:hover{border-color:var(--acc)}
h1,h2,h3{line-height:1.25;margin:0 0 6px}
.meta{font:13px system-ui,sans-serif;color:var(--mute)}
.body{white-space:pre-wrap;margin:16px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.err{color:var(--danger);font:14px system-ui,sans-serif;margin-bottom:8px}
.cm{border-top:1px solid var(--line);padding:10px 0}
</style></head>
<body>
<header><div class="logo" data-act="home">✒️ Inkwell</div><nav id="nav"></nav></header>
<main id="app"></main>
<script>
// ====== CHANGE THIS to your deployed backend URL ======
const API = 'http://localhost:5000/api';

// ---------- API helper ----------
let token = null;
try { token = localStorage.getItem('inkwell_token'); } catch (e) {}
function setToken(t) {
  token = t;
  try { t ? localStorage.setItem('inkwell_token', t) : localStorage.removeItem('inkwell_token'); } catch (e) {}
}
async function call(path, method = 'GET', body) {
  const r = await fetch(API + path, {
    method,
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
    body: body ? JSON.stringify(body) : undefined
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw Error(d.error || 'Request failed');
  return d;
}

// ---------- State ----------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const when = t => new Date(t).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
let me = null, posts = [], post = null, comments = [], view = { name: 'home' }, err = '', busy = false;

async function go(v) {
  view = v; busy = true; render();
  try {
    if (v.name === 'home') posts = await call('/posts');
    if (v.name === 'post') [post, comments] = await Promise.all([call('/posts/' + v.id), call('/posts/' + v.id + '/comments')]);
    if (v.name === 'edit' && v.id) post = await call('/posts/' + v.id);
  } catch (e) { err = e.message; }
  busy = false; render();
}

// ---------- Render ----------
function render() {
  $('#nav').innerHTML = me
    ? `<span class="meta">Hi, ${esc(me.name)}</span><button class="p" data-act="new">+ New post</button><button data-act="logout">Log out</button>`
    : `<button data-act="login">Log in</button><button class="p" data-act="register">Sign up</button>`;
  const e = err ? `<div class="err">${esc(err)}</div>` : ''; err = '';
  let h = '';
  if (busy) h = '<p class="meta">Loading… (the server may take ~30s to wake up)</p>';
  else if (view.name === 'home') {
    h = e + '<h2 style="margin-bottom:14px">Latest posts</h2>' + (posts.map(p => {
      const n = p.commentCount || 0;
      return `<div class="card post" data-act="open" data-id="${p._id}"><h3>${esc(p.title)}</h3><div class="meta">${esc(p.author?.name || 'Unknown')} · ${when(p.createdAt)} · ${n} comment${n === 1 ? '' : 's'}</div><p style="margin:10px 0 0">${esc(p.body.slice(0, 160))}${p.body.length > 160 ? '…' : ''}</p></div>`;
    }).join('') || '<p class="meta">No posts yet. Be the first to write one!</p>');
  } else if (view.name === 'login' || view.name === 'register') {
    const r = view.name === 'register';
    h = `<div class="card"><h2>${r ? 'Create account' : 'Log in'}</h2>${e}${r ? '<label>Name</label><input id="f-name" autocomplete="name">' : ''}<label>Email</label><input id="f-email" type="email" autocomplete="email"><label>Password</label><input id="f-pw" type="password" autocomplete="${r ? 'new-password' : 'current-password'}"><button class="p" data-act="${r ? 'doreg' : 'dologin'}">${r ? 'Sign up' : 'Log in'}</button> <button class="l" data-act="${r ? 'login' : 'register'}">${r ? 'Have an account?' : 'Need an account?'}</button></div>`;
  } else if (view.name === 'edit') {
    const p = view.id && post ? post : { title: '', body: '' };
    h = `<div class="card"><h2>${view.id ? 'Edit post' : 'New post'}</h2>${e}<label>Title</label><input id="f-title" value="${esc(p.title)}"><label>Content</label><textarea id="f-body">${esc(p.body)}</textarea><div class="row"><button class="p" data-act="dosave">${view.id ? 'Save changes' : 'Publish'}</button><button data-act="home">Cancel</button></div></div>`;
  } else if (view.name === 'post' && post) {
    const own = me && post.author && me.id === post.author._id;
    h = `${e}<button class="l" data-act="home">← All posts</button><div class="card" style="margin-top:10px"><h1>${esc(post.title)}</h1><div class="meta">${esc(post.author?.name || 'Unknown')} · ${when(post.createdAt)}${post.updatedAt !== post.createdAt ? ' · edited ' + when(post.updatedAt) : ''}</div><div class="body">${esc(post.body)}</div>${own ? `<div class="row"><button data-act="edit" data-id="${post._id}">Edit</button><button class="d" data-act="del" data-id="${post._id}">Delete</button></div>` : ''}</div>
    <h3>${comments.length} comment${comments.length === 1 ? '' : 's'}</h3><div class="card">${comments.map(c => `<div class="cm"><div class="meta"><b>${esc(c.author?.name || 'Unknown')}</b> · ${when(c.createdAt)}${me && c.author && me.id === c.author._id ? ` · <button class="l d" data-act="delc" data-id="${c._id}">delete</button>` : ''}</div>${esc(c.text)}</div>`).join('') || '<div class="meta">Be the first to comment.</div>'}
    ${me ? `<div style="margin-top:12px"><textarea id="f-com" style="min-height:80px" placeholder="Add a comment…"></textarea><button class="p" data-act="addc">Post comment</button></div>` : '<div class="meta" style="margin-top:12px">Log in to join the discussion.</div>'}</div>`;
  } else h = e;
  $('#app').innerHTML = h;
}

// ---------- Events ----------
document.addEventListener('click', async ev => {
  const t = ev.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, id = t.dataset.id, v = s => ($(s) || {}).value || '';
  try {
    if (a === 'home') return go({ name: 'home' });
    if (a === 'login' || a === 'register') { view = { name: a }; return render(); }
    if (a === 'new') return me ? go({ name: 'edit' }) : (view = { name: 'login' }, render());
    if (a === 'open') return go({ name: 'post', id });
    if (a === 'edit') return go({ name: 'edit', id });
    if (a === 'logout') { setToken(null); me = null; return go({ name: 'home' }); }
    if (a === 'doreg') {
      const d = await call('/auth/register', 'POST', { name: v('#f-name').trim(), email: v('#f-email').trim(), password: v('#f-pw') });
      setToken(d.token); me = d.user; return go({ name: 'home' });
    }
    if (a === 'dologin') {
      const d = await call('/auth/login', 'POST', { email: v('#f-email').trim(), password: v('#f-pw') });
      setToken(d.token); me = d.user; return go({ name: 'home' });
    }
    if (a === 'dosave') {
      const body = { title: v('#f-title'), body: v('#f-body') };
      const p = view.id ? await call('/posts/' + view.id, 'PUT', body) : await call('/posts', 'POST', body);
      return go({ name: 'post', id: p._id });
    }
    if (a === 'del') {
      if (!confirm('Delete this post and its comments?')) return;
      await call('/posts/' + id, 'DELETE'); return go({ name: 'home' });
    }
    if (a === 'addc') {
      await call(`/posts/${view.id}/comments`, 'POST', { text: v('#f-com') });
      comments = await call(`/posts/${view.id}/comments`);
    }
    if (a === 'delc') {
      await call('/comments/' + id, 'DELETE');
      comments = await call(`/posts/${view.id}/comments`);
    }
  } catch (e) { err = e.message; }
  render();
});

// ---------- Init ----------
(async () => {
  if (token) { try { me = await call('/auth/me'); } catch (e) { setToken(null); } }
  go({ name: 'home' });
})();
</script></body></html>
